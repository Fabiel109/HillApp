services:
  - type: web
    name: hillapp-hcr2
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__TiDB
        sync: false
      - key: Email__Provider
        value: Resend
      - key: Email__ApiKey
        sync: false
      - key: Email__FromEmail
        value: HillApp HCR2 <onboarding@resend.dev>
      - key: Email__ToEmail
        value: cfabiel31@gmail.com
      - key: Admin__OwnerEmail
        value: cfabiel31@gmail.com
      - key: Accounts__InactiveDays
        value: "500"
